# ==========================================================================
# xhx2api.1task.cn —— 小浣熊网关的公网入口
# --------------------------------------------------------------------------
# 关键点（少一条就出问题）：
#   🔴 SSE 必须 proxy_buffering off：/v1/chat/completions 的流式响应一旦被
#      nginx 缓冲，客户端会「一直等、最后一次性吐完」，看起来像卡死。
#   🔴 proxy_read_timeout 要长：思考型模型单次生成可达 1-3 分钟（真号实测
#      sn-sensenova-6-8-flash 非流式 74s、流式 25s），默认 60s 会掐断。
#   🔴 证书独立签发（acme.sh），不要和别的域名共用——任一方续期失败会互相拖累。
#
# 部署位置（与 1task.cn 其他服务一致的宝塔路径）：
#   /www/server/panel/vhost/nginx/xhx2api.1task.cn.conf
# ==========================================================================

server {
    listen 80;
    server_name xhx2api.1task.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name xhx2api.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/xhx2api.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xhx2api.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:XHX2API_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /www/wwwlogs/xhx2api.1task.cn.log;
    error_log  /www/wwwlogs/xhx2api.1task.cn.error.log;

    # 长上下文请求体：目录显示上游支持 1M context，请求体可能很大。
    client_max_body_size 64m;
    client_body_timeout  300s;

    location ^~ / {
        # 宝塔全局 proxy.conf 在 http 块启用了 proxy_cache(cache_one)，动态接口
        # 被缓存会串会话/显示陈旧数据。
        proxy_cache off;

        proxy_pass http://127.0.0.1:7867;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # SSE：不缓冲、不限读超时、body 边收边转
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
    }
}
