# xhx2api :80 入口 —— 除 ACME 验证外一律跳 HTTPS
server {
    listen 80;
    server_name xhx2api.1task.cn;

    access_log /www/wwwlogs/xhx2api.1task.cn.log;
    error_log  /www/wwwlogs/xhx2api.1task.cn.error.log;

    # 🔴 ACME HTTP-01：必须 ^~ 且排在 location / 之前，否则被 catch-all 吃掉，
    #    首次签发与三个月后的续期都会失败（失败时没有任何告警，只会某天突然过期）。
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
