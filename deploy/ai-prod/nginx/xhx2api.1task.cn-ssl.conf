# xhx2api HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
#
# ⚠️ 本文件被 nginx 在 **http 块内** include ⇒ `limit_req_zone` 可以写在 server 之外。
#    zone 名带站点前缀防与其他 vhost 重名。
limit_req_zone $binary_remote_addr zone=xhx2api_api:10m rate=600r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xhx2api.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/xhx2api.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/xhx2api.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:XHX2_TLS:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/xhx2api.1task.cn.log;
    error_log  /www/wwwlogs/xhx2api.1task.cn.error.log;

    # 入口层**不做**认证 —— 鉴权交给服务侧 api_key（config.json）。
    # 理由：面板 /panel/ 需要浏览器交互登录，nginx auth_basic 会挡在前面且不兼容。
    auth_basic off;

    location / {
        # 洪水闸门（**不是鉴权**）：10r/s 持续 + 120 突发。
        # 生图/长对话都是长连接，不按请求数频繁触发；burst 吸收合法突发。
        limit_req zone=xhx2api_api burst=120 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/xhx2api-proxy.inc;
    }
}
