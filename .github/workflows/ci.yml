name: ci

# 每次 push / PR 都跑：格式化、静态检查、竞态测试、跨平台编译验证。
# 发版由 release.yml 负责，这里只做质量闸门。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build (linux/amd64)
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/server
