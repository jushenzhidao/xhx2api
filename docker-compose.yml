services:
  xhx2api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: xhx2api:latest
    container_name: xhx2api
    restart: unless-stopped
    # 容器以 uid 10001 运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 让容器以你自己的 uid 运行：PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #   2) sudo chown -R 10001:10001 ./auths ./data ./conf
    #   3) user: "0:0" 以 root 运行（省事但逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    # 镜像默认 `-config /app/config.json`；这里指到目录挂载里，
    # 否则面板「配置」页保存必然 EBUSY（rename 覆盖 mountpoint，见下）。
    entrypoint: ["/app/xhx2api", "-config", "/app/conf/config.json"]
    environment:
      - TZ=Asia/Shanghai
      # 也可以用环境变量覆盖配置（优先级高于 config.json）：
      # - XHX_API_KEY=sk-xhx-xxxx
      # - XHX_LISTEN=0.0.0.0:7867
    ports:
      - "7867:7867"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 配置**必须目录挂载**，不能挂单文件：面板保存走「写 config.json.tmp → rename」，
      # 目标若是单文件 bind mount 的 mountpoint，内核返回 EBUSY（device or resource busy），
      # 保存永远失败。目录挂载下 config.json 只是挂载点里的普通文件，rename 合法。
      # 目录里没有 config.json 时程序会自己生成一份带随机 api_key 的配置。
      - ./conf:/app/conf
